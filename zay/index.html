const SUPPLIERS=[{k:"safwa",n:"الصفوة",y:"العام السابق"},{k:"hat",n:"هاتريك",y:"العام السابق"},{k:"tila",n:"تيلا",y:"العام الحالي"},{k:"fursan",n:"الفرسان",y:"العام الحالي"}];

const SUPX=[...SUPPLIERS,{k:"other",n:"جهة أخرى",y:"فرع أو جهة"}];SUPN.other="جهة أخرى";
const KINDS={in:"إضافة للمخزون",out:"صرف وتسليم",need:"احتياج",adjust:"تعديل جرد",opening:"رصيد افتتاحي"};
const DESTS=[["section","قسم في الفرع"],["branch","فرع آخر"],["staff","موظف"],["other","جهة أخرى"]];

const DUR=[["24 ساعة",1],["3 أيام",3],["أسبوع",7],["شهر",30],["حتى ألغيها",0]];
const LINKH=[["ساعة",1],["24 ساعة",24],["3 أيام",72]];

const S={sb:null,user:null,me:{role:null},items:{},entries:[],marks:{},v2:null,team:[],invites:[],calc:{},tot:{},online:true,loaded:false};
const $=s=>document.querySelector(s);

const fdt=v=>v?new Date(v).toLocaleString("ar-SA-u-nu-latn-ca-gregory",{dateStyle:"medium",timeStyle:"short"}):"";

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}
function waNum(v){let d=String(v).replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="966"+d.slice(1);if(d.length===9&&d.startsWith("5"))d="966"+d;return d.length>=11?d:""}
function loginEmail(v){v=String(v||"").trim();if(/^[\d\s+()\-]{9,}$/.test(v)){const n=waNum(v);return n?n+PHONE_DOMAIN:v}return v.toLowerCase()}
function showId(e){e=String(e||"");return e.endsWith(PHONE_DOMAIN)?"0"+e.slice(3,e.indexOf("@")):e}

/* ============ الحسابات ============ */
function compute(){
  /* الحركات قبل بدء النظام الجديد تُحسب بالطريقة القديمة (الطلب − المصروف − المخزون = العجز) ويصبح العجز هو الاحتياج الافتتاحي.
     بعدها: الإضافة ترفع المخزون وتخصم من الاحتياج تلقائياً، والصرف يخصم من المخزون، والاحتياج يُسجَّل مباشرة. */
  const C={};
  const cell=(code,sz)=>{C[code]??={};return C[code][sz]??={sup:{safwa:0,hat:0,tila:0,fursan:0,other:0},out:0,need:0,lneed:0,lout:0}};
  const cut=S.v2?new Date(S.v2).getTime():Infinity;
  const ord=S.entries.slice().sort((a,b)=>String(a.at||"").localeCompare(String(b.at||"")));
  const legacy=ord.filter(e=>!e.at||new Date(e.at).getTime()<cut),fresh=ord.filter(e=>e.at&&new Date(e.at).getTime()>=cut);
  const each=(e,f)=>{if(!e.code||!e.sizes)return;for(const [sz,q0] of Object.entries(e.sizes)){const q=Number(q0)||0;if(q)f(cell(e.code,sz),q)}};
  const supAdd=(c,e,q)=>{const k=e.supplier in c.sup?e.supplier:"other";c.sup[k]+=q};
  for(const e of legacy)each(e,(c,q)=>{
    if(e.kind==="opening"||e.kind==="in"||e.kind==="adjust")supAdd(c,e,q);
    else if(e.kind==="out"){c.out+=q;c.lout+=q;if(e.deduct!==false)supAdd(c,e,-q)}
    else if(e.kind==="need")c.lneed+=q});
  for(const code in C)for(const sz in C[code]){const c=C[code][sz];const st=Math.max(0,Object.values(c.sup).reduce((a,b)=>a+b,0));c.need=Math.max(0,Math.max(0,c.lneed-c.lout)-st)}
  for(const e of fresh)each(e,(c,q)=>{
    if(e.kind==="opening"||e.kind==="adjust")supAdd(c,e,q);
    else if(e.kind==="in"){supAdd(c,e,q);c.need=Math.max(0,c.need-q)}
    else if(e.kind==="out"){c.out+=q;if(e.deduct!==false)supAdd(c,e,-q)}
    else if(e.kind==="need")c.need=Math.max(0,c.need+q)});
  const lastReason={};for(const e of ord)if(e.kind==="need"&&e.reason&&e.code)for(const sz of Object.keys(e.sizes||{}))lastReason[e.code+"|"+sz]=e.reason;
  for(const code in C)for(const sz in C[code]){const c=C[code][sz];
    c.stock=Math.max(0,Object.values(c.sup).reduce((a,b)=>a+b,0));
    const m=markOf(code,sz);c.mark=m;
    c.status=m&&m.status?m.status:(c.need>0?"unavailable":c.stock>0?"ok":"");
    c.reason=(m&&m.reason)||(c.need>0?lastReason[code+"|"+sz]||"":"");
    c.sur=c.status==="surplus"?c.stock:0}
  S.calc=C;const tot={};S.used={};for(const e of S.entries)S.used[e.code]=true;
  for(const code of Object.keys(S.items)){const t={stock:0,need:0,out:0,sur:0,sup:{safwa:0,hat:0,tila:0,fursan:0,other:0}};
    for(const c of Object.values(C[code]||{})){t.stock+=c.stock;t.need+=c.need;t.out+=c.out;t.sur+=c.sur;for(const k in c.sup)t.sup[k]+=Math.max(0,c.sup[k])}
    const wm=markOf(code,"*");if(wm&&wm.status==="surplus"){t.sur=t.stock}t.mark=wm;
    tot[code]=t}
  S.tot=tot;
}
function markOf(code,sz){const m=S.marks[code];if(!m)return null;return sz==="*"?m["*"]||null:m[sz]||m["*"]||null}
function itemStatus(t){
  if(!t)return["mute","لا حركة"];
  if(t.mark&&t.mark.status==="surplus")return["gold","فائض"];
  if(t.need>0)return["bad","احتياج "+fmt(t.need)];
  if(t.sur>0)return["gold","فيه فائض"];
  if(t.stock>0)return["ok","متوفر"];
  return["mute","لا حركة"];
}
function statusCell(c){
  if(!c||!c.status)return `<span class="pill mute">—</span>`;
  if(c.status==="ok")return `<span class="pill ok">متوفر</span>`;
  const [cls,lab]=MSTAT[c.status];return `<span class="pill ${cls}">${c.status==="surplus"?"فائض":lab}</span>${c.reason?`<small>${esc(c.reason)}</small>`:""}`;
}
const isCat=c=>{const it=S.items[c];return !!(it&&it.catalog&&!(S.used&&S.used[c]))};
const sortedItems=()=>Object.entries(S.items).sort((a,b)=>(a[1].sort??99)-(b[1].sort??99));
const entryQty=e=>Object.values(e.sizes||{}).reduce((a,b)=>a+(Number(b)||0),0);
function utypeFor(it){if(!it)return"";if(it.type==="رياضي")return"زي رياضي";if(it.type==="جاكيت")return"جاكيت";if(it.type&&it.type!=="مدرسي")return it.type;return it.gender==="بنات"?"زي مدرسي بنات":"زي مدرسي بنين"}
function thumb(it,cls="thumb"){return it&&it.image_path?`<img class="${cls}" src="${esc(imgUrl(it.image_path))}" alt="شكل ${esc(it.name)}" loading="lazy">`:`<span class="${cls} ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 6a2 2 0 1 1 2 2c-1 0-2 .6-2 1.5V10m0 0L3 16.5c-.8.6-.4 1.5.5 1.5h17c.9 0 1.3-.9.5-1.5z"/></svg></span>`}

/* ============ قاعدة البيانات ============ */
async function fetchAll(table,order){
  let out=[],from=0;
  for(;;){const {data,error}=await S.sb.from(table).select("*").order(order,{ascending:true}).range(from,from+999);
    if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
  return out;
}
async function loadData(){
  try{
    const [items,entries,st,mk]=await Promise.all([fetchAll("zay_items","sort"),fetchAll("zay_entries","created_at"),S.sb.from("zay_settings").select("*").eq("id",1).maybeSingle(),S.sb.from("zay_marks").select("*")]);
    if(st&&st.data){S.me.catalog_path=st.data.catalog_path||null;if(st.data.public_view!=null)S.me.public_view=st.data.public_view;S.v2=st.data.v2_at||null}
    S.hasV2=!!(st&&st.data&&"v2_at" in st.data);
    S.marks={};for(const m of (mk&&mk.data)||[]){(S.marks[m.item_id]??={})[m.size]=m}
    S.items=Object.fromEntries(items.filter(i=>i.active!==false).map(i=>[i.id,i]));
    S.entries=entries.map(r=>({id:r.id,kind:r.kind,code:r.item_id,supplier:r.supplier,section:r.section,utype:r.utype,sizes:r.sizes||{},date:r.entry_date,receiver:r.receiver,ref:r.ref,note:r.note,deduct:r.deduct,byName:r.created_by_name,at:r.created_at,
      reason:r.reason||"",dest:r.dest_type||"",job:r.receiver_job||"",phone:r.receiver_phone||"",doc:r.doc_no||"",sig:r.signature||"",sigName:r.signed_name||"",sigAt:r.signed_at||null}));
    S.online=true;S.loaded=true;
  }catch(e){S.online=false}
  const st=$("#status");
  if(!S.online){st.hidden=false;st.textContent="تعذّر الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم حدّث الصفحة."}
  else if(!S.me.public_view&&!S.me.role&&!Object.keys(S.items).length){st.hidden=false;st.textContent="الاطلاع متاح لأصحاب الصلاحية فقط. سجّل الدخول للمتابعة."}
  else st.hidden=true;
}
async function loadAdmin(){
  if(!isOwner())return;
  const [t,i]=await Promise.all([S.sb.from("zay_team").select("*").order("created_at"),S.sb.from("zay_invites").select("*").is("used_at",null).gt("link_expires_at",new Date().toISOString()).order("created_at",{ascending:false})]);
  S.team=t.data||[];S.invites=i.data||[];
}
async function loadMe(){
  const {data:{session}}=await S.sb.auth.getSession();S.user=session?session.user:null;
  try{const {data}=await S.sb.rpc("zay_me");S.me=data||{role:null}}catch(e){S.me={role:null}}
  document.body.classList.toggle("ro",!canWrite());
  document.body.classList.toggle("owner",isOwner());
  $("#authBtn").textContent=S.user?"حسابي":"دخول";
  const b=$("#modeBadge");b.hidden=false;
  if(isOwner()){b.className="mode";b.textContent="مدير التطبيق · تحكم كامل"}
  else if(canWrite()){b.className="mode";b.textContent="صلاحية إدخال "+(S.me.expires_at?"حتى "+fdt(S.me.expires_at):"دائمة")}
  else{b.className="mode ro";b.textContent=S.user&&S.me.expired?"انتهت مدة صلاحيتك · وضع الاطلاع فقط":"وضع الاطلاع فقط"}
}

function itemRow(c,it){const t=S.tot[c]||{};
  if(isCat(c))return `<button class="row catrow" type="button" data-item="${esc(c)}">${thumb(it)}<div class="grow"><div class="t">${esc(it.name)}</div>
  <div class="s">${esc([it.codes,it.stage,it.type].filter(Boolean).join(" · "))}</div></div><span class="pill cat">كتالوج</span></button>`;
  const [cls,lab]=itemStatus(t);
  return `<button class="row" type="button" data-item="${esc(c)}">${thumb(it)}<div class="grow"><div class="t">${esc(it.name)}</div>
  <div class="s num">المخزون ${fmt(t.stock)}${t.need?` · <b style="color:var(--bad)">الاحتياج ${fmt(t.need)}</b>`:""}${t.sur?` · <b style="color:var(--gold)">فائض ${fmt(t.sur)}</b>`:""}</div></div><span class="pill ${cls}">${esc(lab)}</span></button>`}

async function shrink(file){
  if(!/^image\//.test(file.type))throw new Error("type");
  const bmp=await createImageBitmap(file).catch(()=>null);if(!bmp)return file;
  const max=1400,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.85));
}

   `${code?`<button class="btn ghost" type="button" id="iHide">إخفاء الصنف</button>`:""}<span class="total"></span><button class="btn" type="button" id="iSave">حفظ</button>`);
  $("#sheetBody").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{it[b.dataset.f]=b.dataset.v;$("#sheetBody").querySelectorAll(`[data-f="${b.dataset.f}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b))});

  $("#imDel").onclick=()=>{newFile=null;removeImg=true;$("#imPrev").hidden=true;$("#imDel").hidden=true};
  if(code)$("#iHide").onclick=()=>confirmBox("إخفاء هذا الصنف من القوائم؟ تبقى حركاته محفوظة في قاعدة البيانات.",async()=>{const {error}=await S.sb.from("zay_items").update({active:false,updated_at:new Date().toISOString()}).eq("id",code);toast(error?"تعذّر الإخفاء":"أُخفي الصنف");refresh()},"إخفاء");
  $("#iSave").onclick=async()=>{
    const name=$("#iName").value.trim();if(!name){$("#ierr").textContent="اكتب اسم الصنف.";return}
    const b=$("#iSave");b.disabled=true;b.textContent="جارٍ الحفظ…";
    try{
      const id=code||("IT-"+rid());let image_path=removeImg?null:it.image_path||null;
      if(newFile){const blob=await shrink(newFile);const path=`items/${id}/${Date.now()}.jpg`;
        const {error}=await S.sb.storage.from("zay").upload(path,blob,{contentType:"image/jpeg",upsert:true});if(error)throw error;
        if(it.image_path)S.sb.storage.from("zay").remove([it.image_path]).catch(()=>{});image_path=path}
      else if(removeImg&&it.image_path){S.sb.storage.from("zay").remove([it.image_path]).catch(()=>{})}
      const row={id,name,system:it.system,stage:$("#iStage").value.trim(),gender:it.gender,type:it.type,note:$("#iNote").value.trim()||null,image_path,sort:it.sort??0,active:true,size_set:it.size_set,catalog:!!it.catalog,codes:$("#iCodes").value.trim()||null,cat_page:it.cat_page??null,updated_at:new Date().toISOString()};
      const {error}=await S.sb.from("zay_items").upsert(row);if(error)throw error;

    }catch(e){b.disabled=false;b.textContent="حفظ";$("#ierr").textContent=e&&e.message==="type"?"الملف المختار ليس صورة.":"تعذّر الحفظ. تحقق من الاتصال وأعد المحاولة."}
  };
}

/* ============ استيراد صور الكتالوج من ملف PDF (المالك) ============ */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function importCatalog(){
  if(!isOwner())return;
  const items=sortedItems().filter(([,it])=>it.cat_page);
  openSheet("استيراد صور الكتالوج",`
   <div class="hint">اختر ملف كتالوج الزي (PDF). يقرأ التطبيق كل صفحة ويقصّها ويضعها صورةً للصنف المرتبط بها (${items.length} صنفاً)، ويحفظ ملف الكتالوج نفسه ليفتحه الجميع من صفحة الأصناف.</div>
   <label class="btn ghost" for="pdfIn">اختيار ملف الكتالوج (PDF)</label><input type="file" id="pdfIn" accept="application/pdf" hidden>
   <div class="toggle"><div><b>استبدال الصور الحالية</b><div class="hint">عند الإيقاف تُضاف الصور للأصناف التي ليس لها صورة فقط.</div></div><button class="sw" type="button" role="switch" id="repl" aria-checked="true" aria-label="استبدال الصور الحالية"></button></div>
   <div class="prog" hidden id="pg"><div></div></div><div class="hint num" id="pgt"></div><div class="err" id="perr"></div>`,"");
  let repl=true;$("#repl").onclick=()=>{repl=!repl;$("#repl").setAttribute("aria-checked",repl)};
  $("#pdfIn").onchange=async e=>{
    const file=e.target.files[0];if(!file)return;const t=$("#pgt"),er=$("#perr"),bar=$("#pg");bar.hidden=false;er.textContent="";
    try{
      t.textContent="جارٍ تحميل قارئ PDF…";
      if(!window.pdfjsLib){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")}
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const buf=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
      const p3=await (await pdf.getPage(Math.min(3,pdf.numPages))).getTextContent();
      if(!p3.items.map(x=>x.str).join("").replace(/\s/g,"").includes("ANDS01")){er.textContent="هذا الملف لا يطابق كتالوج الزي المعتمد (لم أجد ANDS01 في الصفحة 3). لم يُستورد شيء.";return}
      t.textContent="جارٍ رفع ملف الكتالوج…";
      const cpath="catalog/zay-catalog-"+Date.now()+".pdf";
      const up=await S.sb.storage.from("zay").upload(cpath,new Blob([buf],{type:"application/pdf"}),{contentType:"application/pdf",upsert:true});
      if(!up.error){const old=S.me.catalog_path;await S.sb.from("zay_settings").update({catalog_path:cpath}).eq("id",1);if(old)S.sb.storage.from("zay").remove([old]).catch(()=>{});S.me.catalog_path=cpath}
      const todo=items.filter(([,it])=>repl||!it.image_path);const cache={};let done=0,fail=0,lastErr=up.error?(up.error.message||String(up.error)):"";
      for(const [code,it] of todo){
        t.textContent=`صفحة ${it.cat_page} — ${it.name} (${done+1}/${todo.length})`;
        try{
          let blob=cache[it.cat_page];
          if(!blob){const page=await pdf.getPage(it.cat_page);const vp=page.getViewport({scale:2.2});
            const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
            const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
            await page.render({canvasContext:ctx,viewport:vp}).promise;
            const h=Math.round(cv.height*.87),out=document.createElement("canvas");out.width=cv.width;out.height=h;
            out.getContext("2d").drawImage(cv,0,0,cv.width,h,0,0,cv.width,h);
            blob=await new Promise(r=>out.toBlob(r,"image/jpeg",.82));cache[it.cat_page]=blob;page.cleanup()}
          const path=`items/${code}/catalog-p${it.cat_page}-${Date.now()}.jpg`;
          const {error}=await S.sb.storage.from("zay").upload(path,blob,{contentType:"image/jpeg",upsert:true});if(error)throw error;
          const {error:e2}=await S.sb.from("zay_items").update({image_path:path,updated_at:new Date().toISOString()}).eq("id",code);if(e2)throw e2;
          if(it.image_path)S.sb.storage.from("zay").remove([it.image_path]).catch(()=>{});
        }catch(x){fail++;lastErr=(x&&(x.message||x.error))||String(x)}
        done++;bar.firstElementChild.style.width=Math.round(done/todo.length*100)+"%";
      }
      t.textContent=`تم: ${done-fail} صورة${fail?` · تعذّر ${fail}`:""}${up.error?" · لم يُحفظ ملف الكتالوج":""}`;if(lastErr&&(fail||up.error))er.textContent="سبب الخطأ: "+lastErr;
      toast("اكتمل استيراد صور الكتالوج");await refresh();
    }catch(x){er.textContent="تعذّر قراءة الملف أو تحميل قارئ PDF. تحقق من الاتصال وأعد المحاولة."}
  };
}

/* ============ نموذج الإدخال ============ */
function openEntry(kind,pre={}){
  if(!canWrite()){toast(S.user?"وضع الاطلاع فقط. للإدخال تواصل مع "+OWNER_NAME:"سجّل الدخول أولاً");if(!S.user)openAuth();return}
  if(kind==="out")return openIssue(pre);
  const f={kind,code:pre.code||"",supplier:"",section:pre.section||"",sizes:{},date:today(),receiver:"",ref:"",note:"",reason:"",neg:false};
  openSheet("إدخال جديد","",`<div class="total">الإجمالي <b class="num" id="tot">0</b> قطعة</div><button class="btn" type="button" id="save">حفظ</button>`);
  const autoSup=()=>{const cs=S.calc[f.code]||{};for(const s of SUPPLIERS){if(sizesFor(f.code).some(z=>cs[z]&&cs[z].sup[s.k]>0)){f.supplier=s.k;return}}};
  const sumUp=()=>{$("#tot").textContent=fmt(Object.values(f.sizes).reduce((a,b)=>a+b,0))};
  const draw=()=>{
    const it=S.items[f.code];const cs=S.calc[f.code]||{};
    const needSup=f.kind!=="need",needSec=f.kind==="need";
    const groups={};for(const [c,i] of sortedItems())(groups[isCat(c)?"من الكتالوج (غير مسجّل بالمخزون)":(i.system||"")+" — "+(i.type||"")]??=[]).push([c,i]);
    $("#sheetBody").innerHTML=`
    <div class="kinds" role="group" aria-label="نوع الحركة">${["in","out","need","adjust"].map(k=>`<button type="button" data-kind="${k}" aria-pressed="${f.kind===k}">${KINDS[k]}</button>`).join("")}</div>
    <div class="field"><label for="fCode">الصنف</label><select id="fCode"><option value="">اختر الصنف…</option>${Object.entries(groups).map(([g,arr])=>`<optgroup label="${esc(g)}">${arr.map(([c,i])=>`<option value="${esc(c)}" ${c===f.code?"selected":""}>${esc(i.name)}${isCat(c)?" ◇":""}</option>`).join("")}</optgroup>`).join("")}</select>
      ${it&&it.image_path?`<img src="${esc(imgUrl(it.image_path))}" alt="شكل ${esc(it.name)}" style="width:100%;max-height:150px;object-fit:contain;background:var(--sunk);border-radius:12px">`:""}</div>
    ${f.kind==="need"?`<div class="field"><span class="lab">سبب الاحتياج</span><div class="chips">${REASONS.map(r=>`<button type="button" class="chip" data-rsn="${esc(r)}" aria-pressed="${f.reason===r||(r==="أخرى"&&f.reason&&!REASONS.includes(f.reason))}">${esc(r)}</button>`).join("")}</div>
      ${f.reason&&!REASONS.slice(0,-1).includes(f.reason)?`<input type="text" id="fRsn" value="${esc(f.reason==="أخرى"?"":f.reason)}" placeholder="اكتب السبب" style="margin-top:8px">`:""}</div>
      <div class="field"><span class="lab">نوع التسجيل</span><div class="chips"><button type="button" class="chip" data-neg="0" aria-pressed="${!f.neg}">إضافة احتياج</button><button type="button" class="chip" data-neg="1" aria-pressed="${f.neg}">تخفيض أو إلغاء احتياج</button></div></div>`:""}
    ${needSec?`<div class="field"><label for="fSec">القسم الطالب (اختياري)</label><select id="fSec"><option value="">—</option>${SECTIONS.map(s=>`<option ${s===f.section?"selected":""}>${s}</option>`).join("")}</select></div>`:""}
    ${needSup?`<div class="field"><span class="lab">${f.kind==="in"?"مصدر الإضافة":"المورد"}</span><div class="chips">${SUPX.map(s=>`<button type="button" class="chip" data-sup="${s.k}" aria-pressed="${f.supplier===s.k}">${s.n}<small style="opacity:.75"> · ${s.y}</small></button>`).join("")}</div>
      ${f.supplier==="other"&&f.kind==="in"?`<input type="text" id="fSrc" value="${esc(f.section)}" placeholder="اسم الجهة، مثل: فرع الروضة" style="margin-top:8px">`:""}
      ${f.kind==="in"?`<div class="hint">الكمية المضافة تُخصم تلقائياً من احتياج نفس المقاس.</div>`:""}</div>`:""}
    <div class="field"><span class="lab">الكميات حسب المقاس ${f.kind==="adjust"?"(اكتب − للنقص)":""}</span>
      ${f.code?`<div class="sizes num">${sizesFor(f.code).map(s=>{const c=cs[s];let h="";
        if(f.kind==="need")h=c&&c.need?"احتياج "+c.need:(c&&c.stock?"مخزون "+c.stock:"");
        else if(f.kind==="in")h=c&&c.need?"احتياج "+c.need:(c&&c.stock?"حالياً "+c.stock:"");
        else h=c&&c.stock?"حالياً "+c.stock:"";
        const v=f.sizes[s]??"";
        return `<div class="szc ${v?"on":""}"><span class="n">${s}</span><span class="h">${h}</span><input id="sz${s}" type="${f.kind==="adjust"?"text":"number"}" inputmode="${f.kind==="adjust"?"text":"numeric"}" ${f.kind==="adjust"?"":'min="0"'} value="${v}" data-sz="${s}" aria-label="مقاس ${s}"></div>`}).join("")}</div>`:`<div class="hint">اختر الصنف أولاً لتظهر المقاسات.</div>`}
    </div>
    <div class="field"><label for="fDate">التاريخ</label><input type="date" id="fDate" value="${f.date}"></div>
    ${f.kind==="out"?`<div class="field"><label for="fRec">اسم المستلم</label><input type="text" id="fRec" value="${esc(f.receiver)}" placeholder="اسم من استلم الزي"></div>`:""}
    ${f.kind==="in"?`<div class="field"><label for="fRef">رقم الفاتورة أو سند الاستلام</label><input type="text" id="fRef" value="${esc(f.ref)}"></div>`:""}
    <div class="field"><label for="fNote">ملاحظة</label><textarea id="fNote" placeholder="اختياري">${esc(f.note)}</textarea></div>
    <div class="err" id="ferr"></div>`;
    $("#sheetBody").querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{if(b.dataset.kind==="out"){openIssue({code:f.code});return}f.kind=b.dataset.kind;if(f.kind==="need")f.supplier="";draw()});
    $("#sheetBody").querySelectorAll("[data-rsn]").forEach(b=>b.onclick=()=>{f.reason=b.dataset.rsn;draw()});
    $("#sheetBody").querySelectorAll("[data-neg]").forEach(b=>b.onclick=()=>{f.neg=b.dataset.neg==="1";draw()});
    if($("#fRsn"))$("#fRsn").oninput=e=>f.reason=e.target.value.trim()||"أخرى";
    if($("#fSrc"))$("#fSrc").oninput=e=>f.section=e.target.value;
    $("#fCode").onchange=e=>{f.code=e.target.value;f.sizes={};draw()};
    if($("#fSec"))$("#fSec").onchange=e=>f.section=e.target.value;
    $("#sheetBody").querySelectorAll("[data-sup]").forEach(b=>b.onclick=()=>{f.supplier=b.dataset.sup;if(f.supplier!=="other"&&f.kind==="in")f.section="";draw()});
    $("#sheetBody").querySelectorAll("[data-sz]").forEach(inp=>inp.oninput=()=>{const v=inp.value.trim().replace("−","-");const n=Number(v);
      if(v===""||!n)delete f.sizes[inp.dataset.sz];else f.sizes[inp.dataset.sz]=n;inp.parentElement.classList.toggle("on",!!f.sizes[inp.dataset.sz]);sumUp()});
    $("#fDate").onchange=e=>f.date=e.target.value;
    if($("#fRec"))$("#fRec").oninput=e=>f.receiver=e.target.value;
    if($("#fRef"))$("#fRef").oninput=e=>f.ref=e.target.value;
    $("#fNote").oninput=e=>f.note=e.target.value;
    sumUp();
  };
  draw();
  $("#save").onclick=async()=>{
    const err=m=>{$("#ferr").textContent=m;$("#ferr").scrollIntoView({block:"center"})};
    if(!f.code)return err("اختر الصنف.");
    if(f.kind==="need"&&(!f.reason||f.reason==="أخرى"&&!$("#fRsn")?.value.trim()))return err("اختر سبب الاحتياج.");
    if(f.kind!=="need"&&!f.supplier)return err("اختر المصدر أو المورد.");
    if(f.kind==="in"&&f.supplier==="other"&&!f.section.trim())return err("اكتب اسم الجهة.");
    const sz=Object.fromEntries(Object.entries(f.sizes).filter(([,q])=>q));
    if(!Object.keys(sz).length)return err("أدخل كمية لمقاس واحد على الأقل.");
    if(Object.values(sz).some(q=>!Number.isInteger(q)))return err("الكميات يجب أن تكون أعداداً صحيحة.");
    if(f.kind!=="adjust"&&Object.values(sz).some(q=>q<0))return err("الكميات يجب أن تكون موجبة.");
    if(f.kind==="need"&&f.neg)for(const k in sz)sz[k]=-Math.abs(sz[k]);
    const row={kind:f.kind,item_id:f.code,sizes:sz,entry_date:f.date||today(),note:f.note.trim()||null,created_by:S.user.id,created_by_name:myName()};
    if(f.kind!=="need")row.supplier=f.supplier;
    if(f.kind==="need"){if(f.section)row.section=f.section;row.utype=utypeFor(S.items[f.code]);if(S.hasV2)row.reason=f.reason}
    if(f.kind==="in"){row.ref=f.ref.trim()||null;if(f.supplier==="other")row.section=f.section.trim()}
    const b=$("#save");b.disabled=true;b.textContent="جارٍ الحفظ…";
    const {error}=await S.sb.from("zay_entries").insert(row);
    if(error){b.disabled=false;b.textContent="حفظ";err(/row-level|42501|permission/i.test(error.message+" "+error.code)?"لم يُقبل الحفظ: صلاحيتك لا تسمح بالإدخال أو انتهت مدتها.":"تعذّر الحفظ. تحقق من الاتصال وأعد المحاولة.");return}
    closeSheet();toast("تم حفظ "+KINDS[f.kind]);refresh();
  };
}

/* ============ الصرف والتسليم (عدة أصناف في نموذج واحد) ============ */
function openIssue(pre={}){
  if(!canWrite()){toast(S.user?"وضع الاطلاع فقط":"سجّل الدخول أولاً");if(!S.user)openAuth();return}
  if(!S.hasV2){toast("شغّل ملف التحديث في Supabase أولاً لتفعيل نماذج التسليم");return}
  const f={dest:"section",place:"",receiver:"",job:"",phone:"",date:today(),note:"",lines:[],sig:null};
  const newLine=code=>{const L={code:code||"",supplier:"",sizes:{}};if(L.code)L.supplier=bestSup(L.code);return L};
  f.lines.push(newLine(pre.code));if(pre.section)f.place=pre.section;
  openSheet("صرف وتسليم","",`<div class="total">الإجمالي <b class="num" id="tot">0</b> قطعة</div><button class="btn" type="button" id="save">حفظ وإصدار النموذج</button>`);
  const sumUp=()=>{$("#tot").textContent=fmt(f.lines.reduce((a,L)=>a+Object.values(L.sizes).reduce((x,y)=>x+y,0),0))};
  const opts=code=>{const groups={};for(const [c,i] of sortedItems()){if(isCat(c))continue;(groups[(i.system||"")+" — "+(i.type||"")]??=[]).push([c,i])}
    return `<option value="">اختر الصنف…</option>`+Object.entries(groups).map(([g,arr])=>`<optgroup label="${esc(g)}">${arr.map(([c,i])=>`<option value="${esc(c)}" ${c===code?"selected":""}>${esc(i.name)} (${fmt((S.tot[c]||{}).stock)})</option>`).join("")}</optgroup>`).join("")};
  const draw=()=>{
    const placeField=f.dest==="section"?`<select id="xPlace"><option value="">اختر القسم…</option>${SECTIONS.map(s=>`<option ${s===f.place?"selected":""}>${s}</option>`).join("")}</select>`
      :`<input type="text" id="xPlace" value="${esc(f.place)}" placeholder="${f.dest==="branch"?"اسم الفرع":f.dest==="staff"?"القسم أو الإدارة التي يتبعها":"اسم الجهة"}">`;
    $("#sheetBody").innerHTML=`
    <div class="field"><span class="lab">يُصرف إلى</span><div class="chips">${DESTS.map(([k,n])=>`<button class="chip" type="button" data-dst="${k}" aria-pressed="${f.dest===k}">${n}</button>`).join("")}</div>${placeField}</div>
    <div class="field"><label for="xRec">اسم المستلم</label><input type="text" id="xRec" value="${esc(f.receiver)}" placeholder="الاسم الكامل لمن يستلم الزي"></div>
    <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label for="xJob">صفته</label><input type="text" id="xJob" value="${esc(f.job)}" placeholder="مثل: وكيلة المرحلة"></div>
      <div class="field"><label for="xPh">جواله (اختياري)</label><input type="tel" id="xPh" dir="ltr" value="${esc(f.phone)}" placeholder="05xxxxxxxx"></div></div>
    ${f.lines.map((L,i)=>{const cs=S.calc[L.code]||{};const it=S.items[L.code];
      return `<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>الصنف ${i+1}</b>${f.lines.length>1?`<button class="chip sm" type="button" data-rml="${i}">إزالة</button>`:""}</div>
      <select data-lc="${i}" aria-label="الصنف ${i+1}">${opts(L.code)}</select>

    $("#xRec").oninput=e=>f.receiver=e.target.value;$("#xJob").oninput=e=>f.job=e.target.value;$("#xPh").oninput=e=>f.phone=e.target.value;
    $("#xDate").onchange=e=>f.date=e.target.value;$("#xNote").oninput=e=>f.note=e.target.value;
    B.querySelectorAll("[data-lc]").forEach(sel=>sel.onchange=()=>{f.lines[+sel.dataset.lc]=newLine(sel.value);draw()});

    B.querySelectorAll("[data-li]").forEach(inp=>inp.oninput=()=>{const L=f.lines[+inp.dataset.li];const n=Math.floor(Number(inp.value)||0);if(n>0)L.sizes[inp.dataset.sz]=n;else delete L.sizes[inp.dataset.sz];inp.parentElement.classList.toggle("on",n>0);sumUp()});
    $("#addL").onclick=()=>{f.lines.push(newLine(""));draw()};
    const sg=()=>signPad(f.receiver,(img,name)=>{f.sig=img;if(name&&!f.receiver)f.receiver=name;reopen()});
    if($("#doSig"))$("#doSig").onclick=sg;if($("#reSig"))$("#reSig").onclick=sg;

  };
  const reopen=()=>{openSheet("صرف وتسليم","",`<div class="total">الإجمالي <b class="num" id="tot">0</b> قطعة</div><button class="btn" type="button" id="save">حفظ وإصدار النموذج</button>`);draw();$("#save").onclick=save};

    if(f.receiver.trim().length<3)return err("اكتب اسم المستلم كاملاً.");
    const lines=f.lines.filter(L=>L.code&&Object.keys(L.sizes).length);

    for(const L of lines){const cs=S.calc[L.code]||{};const over=Object.entries(L.sizes).filter(([s,q])=>q>Math.max(0,(cs[s]&&cs[s].sup[L.supplier])||0));
      if(over.length)return err("الكمية أكبر من المتاح في «"+S.items[L.code].name+"» مقاس: "+over.map(o=>o[0]).join("، "))}
    const b=$("#save");b.disabled=true;b.textContent="جارٍ الحفظ…";

    const now=new Date().toISOString();
    const rows=lines.map(L=>({kind:"out",item_id:L.code,supplier:L.supplier,sizes:L.sizes,entry_date:f.date||today(),section:f.place.trim(),dest_type:f.dest,

      signature:f.sig||null,signed_name:f.sig?f.receiver.trim():null,signed_at:f.sig?now:null,utype:utypeFor(S.items[L.code]),created_by:S.user.id,created_by_name:myName()}));
    const {error}=await S.sb.from("zay_entries").insert(rows);
    if(error){b.disabled=false;b.textContent="حفظ وإصدار النموذج";return err(/row-level|42501|permission/i.test(error.message+" "+error.code)?"لم يُقبل الحفظ: صلاحيتك لا تسمح بالإدخال أو انتهت مدتها.":"تعذّر الحفظ. تحقق من الاتصال وأعد المحاولة.")}
    closeSheet();toast("تم الصرف وإصدار النموذج "+doc);await refresh();openDoc(doc);
  };
  draw();$("#save").onclick=save;
}

/* لوحة التوقيع */
function signPad(name,done){
  openSheet("توقيع المستلم",`<div class="field"><label for="sgName">اسم المستلم</label><input type="text" id="sgName" value="${esc(name||"")}"></div>
   <div class="hint">يوقّع المستلم بإصبعه داخل المربع.</div>
   <canvas id="pad" style="width:100%;height:220px;background:#fff;border:1.5px dashed var(--line);border-radius:14px;touch-action:none"></canvas>
   <button class="chip sm" type="button" id="padClr" style="align-self:flex-start">مسح</button><div class="err" id="sgErr"></div>`,
   `<button class="btn" type="button" id="padOk" style="flex:1">اعتماد التوقيع</button>`);
  const cv=$("#pad"),r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const x=cv.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0B1F4D";
  let drawing=false,inked=0,last=null;const P=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{drawing=true;last=P(e);cv.setPointerCapture(e.pointerId);x.beginPath();x.arc(last[0],last[1],1.1,0,7);x.fill()};
  cv.onpointermove=e=>{if(!drawing)return;const p=P(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();inked+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  $("#padClr").onclick=()=>{x.clearRect(0,0,cv.width,cv.height);inked=0};
  $("#padOk").onclick=()=>{if(inked<40){$("#sgErr").textContent="التوقيع قصير جداً، وقّع داخل المربع.";return}
    const o=document.createElement("canvas");const w=600,h=Math.round(cv.height/cv.width*w);o.width=w;o.height=h;const ox=o.getContext("2d");ox.fillStyle="#fff";ox.fillRect(0,0,w,h);ox.drawImage(cv,0,0,w,h);
    done(o.toDataURL("image/png"),$("#sgName").value.trim())};
}

function openAuth(mode){
  if(S.user&&!mode){
    openSheet("حسابي",`<div class="card pad"><div><b>${esc(myName())}</b><div class="hint" dir="auto">${esc(showId(S.user.email))}</div></div>
      <div>${isOwner()?'<span class="pill gold">مدير التطبيق</span>':canWrite()?`<span class="pill ok">صلاحية إدخال ${S.me.expires_at?"حتى "+fdt(S.me.expires_at):"دائمة"}</span>`:'<span class="pill mute">اطلاع فقط</span>'}</div></div>`,
      `<button class="btn ghost" type="button" id="outBtn" style="flex:1">تسجيل الخروج</button>`);
    $("#outBtn").onclick=async()=>{await S.sb.auth.signOut().catch(()=>{});closeSheet();await afterAuth()};return}
  mode=mode||"in";
  const titles={in:"تسجيل الدخول",up:"إنشاء حساب",reset:"استعادة كلمة المرور",newpass:"كلمة مرور جديدة"};
  openSheet(titles[mode],`
    <img src="../bait/logo.png" alt="شركة الأندلس التعليمية" style="height:60px;align-self:center;filter:var(--logo-filter)">
    <div class="msg-ok" id="inv"></div>
    <div class="hint">استخدم نفس حسابك في منصة متابعات المنار.</div>
    ${mode!=="newpass"?`<div class="field"><label for="aId">البريد الإلكتروني أو رقم الجوال</label><input type="text" id="aId" dir="ltr" autocomplete="username" placeholder="name@as.sch.sa"></div>`:""}
    ${mode!=="reset"?`<div class="field"><label for="aPw">كلمة المرور</label><input type="password" id="aPw" dir="ltr" autocomplete="${mode==="in"?"current-password":"new-password"}"></div>`:""}
    <div class="err" id="aErr"></div>
    <div class="chips">${mode==="in"?`<button class="chip sm" type="button" data-am="reset">نسيت كلمة المرور</button>${inviteToken?`<button class="chip sm" type="button" data-am="up">ليس لدي حساب</button>`:""}`:mode!=="newpass"?`<button class="chip sm" type="button" data-am="in">لدي حساب</button>`:""}</div>`,
    `<button class="btn" type="button" id="aGo" style="flex:1">${titles[mode]}</button>`);
  if(inviteToken)S.sb.rpc("zay_invite_info",{p_token:inviteToken}).then(({data})=>{const el=$("#inv");if(el)el.textContent=data?`أهلاً ${data.name||""}، لديك دعوة لصلاحية الإدخال${data.access_days?" لمدة "+data.access_days+" يوم":""}. سجّل الدخول لتفعيلها.`:"رابط الدعوة غير صالح أو انتهت مدته."});
  $("#sheetBody").querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>openAuth(b.dataset.am));
  $("#aGo").onclick=async()=>{const e=$("#aErr");e.textContent="";const id=$("#aId")?loginEmail($("#aId").value):"",pw=$("#aPw")?$("#aPw").value:"";
    const go=$("#aGo");go.disabled=true;
    try{
      if(mode==="in"){const {error}=await S.sb.auth.signInWithPassword({email:id,password:pw});if(error)throw error;closeSheet();await afterAuth()}
      else if(mode==="up"){if(pw.length<8)throw{message:"short"};const {data,error}=await S.sb.auth.signUp({email:id,password:pw,options:{emailRedirectTo:here()}});if(error)throw error;
        if(!data.session){e.className="msg-ok";e.textContent="أرسلنا رسالة تأكيد إلى بريدك. افتحها ثم ارجع وسجّل الدخول.";go.disabled=false;return}closeSheet();await afterAuth()}
      else if(mode==="reset"){const {error}=await S.sb.auth.resetPasswordForEmail(id,{redirectTo:here()});if(error)throw error;e.className="msg-ok";e.textContent="أرسلنا رابط الاستعادة إلى بريدك.";}
      else if(mode==="newpass"){if(pw.length<8)throw{message:"short"};const {error}=await S.sb.auth.updateUser({password:pw});if(error)throw error;closeSheet();toast("تم تغيير كلمة المرور");await afterAuth()}
    }catch(x){const m=(x&&x.message)||"";e.className="err";
      e.textContent=m==="short"?"كلمة المرور 8 أحرف على الأقل.":/invalid login|credentials/i.test(m)?"البيانات غير صحيحة.":/confirm/i.test(m)?"أكّد بريدك أولاً من الرسالة المرسلة.":/already/i.test(m)?"الحساب موجود، سجّل الدخول.":"تعذّر الإكمال، حاول مرة أخرى."}
    go.disabled=false};
}
async function afterAuth(){await loadMe();await redeemInvite();await loadMe();await refresh()}

/* ============ أدوات ============ */
function openSheet(title,body,foot){$("#sheetTitle").textContent=title;$("#sheetBody").innerHTML=body;$("#sheetFoot").innerHTML=foot||"";$("#sheetFoot").hidden=!foot;$("#sheetBack").hidden=false;document.body.style.overflow="hidden"}
function closeSheet(){$("#sheetBack").hidden=true;document.body.style.overflow=""}
function confirmBox(msg,onYes,yes="حذف"){openSheet("تأكيد",`<p style="margin:0">${esc(msg)}</p>`,`<button class="btn ghost" type="button" style="flex:1" id="cNo">رجوع</button><button class="btn danger" type="button" style="flex:1" id="cYes">${esc(yes)}</button>`);$("#cNo").onclick=closeSheet;$("#cYes").onclick=async()=>{closeSheet();await onYes()}}
async function copy(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){openSheet("انسخ النص",`<textarea style="min-height:240px" readonly>${esc(txt)}</textarea>`,`<button class="btn" type="button" style="flex:1" id="okT">تم</button>`);$("#okT").onclick=closeSheet}}
function exportCsv(){
  compute();const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const L=["﻿"+["الصنف","النظام","المرحلة","المقاس","الصفوة","هاتريك","تيلا","الفرسان","جهة أخرى","المخزون","الاحتياج","الحالة","السبب"].map(q).join(",")];
  for(const [c,it] of sortedItems())for(const s of sizesFor(c)){const x=S.calc[c]&&S.calc[c][s];if(!x||!(x.stock||x.need||x.mark))continue;
    L.push([it.name,it.system,it.stage,s,...SUPX.map(p=>Math.max(0,x.sup[p.k])),x.stock,x.need,x.status==="ok"?"متوفر":x.status?MSTAT[x.status][1]:"",x.reason].map(q).join(","))}
  L.push("");L.push(q("سجل الحركات"));L.push(["التاريخ","النوع","الصنف","المصدر","الجهة","المقاسات","الإجمالي","المستلم","رقم النموذج","السبب","ملاحظة","أدخله"].map(q).join(","));
  for(const e of S.entries.slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))))
    L.push([e.date,KINDS[e.kind],S.items[e.code]?S.items[e.code].name:e.code,SUPN[e.supplier]||"",e.section||"",Object.entries(e.sizes||{}).map(([s,n])=>s+":"+n).join(" "),entryQty(e),e.receiver,e.doc||e.ref,e.reason,e.note,e.byName].map(q).join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="مخزون_الزي_فرع_المنار_"+today()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

$("#sheetClose").onclick=closeSheet;
$("#sheetBack").addEventListener("click",e=>{if(e.target.id==="sheetBack")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("#fab").onclick=()=>openEntry("in");
$("#authBtn").onclick=()=>openAuth();
window.addEventListener("hashchange",route);
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-item],[data-new],[data-sys],[data-section],[data-doc],[data-docf],[data-logk],[data-del],[data-adur],[data-ldur],[data-lh],[data-ext],[data-rev],[data-cinv]");if(!t)return;
  const d=t.dataset;
  if(d.item)openItem(d.item);
  else if(d.new)openEntry(d.new);
  else if(d.sys){filt.sys=d.sys;vItems()}
  else if(d.section)openSection(d.section);
  else if(d.doc)openDoc(d.doc);
  else if(d.docf){filt.doc=d.docf;vDocs()}
  else if(d.logk){filt.logKind=d.logk;vLog()}
  else if(!isOwner())return;
  else if(d.del)confirmBox("حذف هذه الحركة نهائياً؟ سيتغير المخزون تبعاً لها.",async()=>{const {error}=await S.sb.from("zay_entries").delete().eq("id",d.del);toast(error?"تعذّر الحذف":"تم الحذف");refresh()});
  else if(d.adur!==undefined){acc.dur=Number(d.adur);t.parentElement.querySelectorAll("[data-adur]").forEach(x=>x.setAttribute("aria-pressed",x===t))}
  else if(d.ldur!==undefined){acc.linkDur=Number(d.ldur);t.parentElement.querySelectorAll("[data-ldur]").forEach(x=>x.setAttribute("aria-pressed",x===t))}
  else if(d.lh!==undefined){acc.linkH=Number(d.lh);t.parentElement.querySelectorAll("[data-lh]").forEach(x=>x.setAttribute("aria-pressed",x===t))}
  else if(d.ext){const m=S.team.find(x=>x.id===d.ext);const base=Math.max(Date.now(),m&&m.expires_at?new Date(m.expires_at).getTime():0);
    const {error}=await S.sb.from("zay_team").update({expires_at:new Date(base+7*864e5).toISOString()}).eq("id",d.ext);toast(error?"تعذّر التمديد":"مُدّدت أسبوعاً");refresh()}
  else if(d.rev)confirmBox("إلغاء صلاحية الإدخال لهذا الشخص؟ يبقى بإمكانه الاطلاع فقط.",async()=>{const {error}=await S.sb.from("zay_team").delete().eq("id",d.rev);toast(error?"تعذّر الإلغاء":"أُلغيت الصلاحية");refresh()},"إلغاء الصلاحية");
  else if(d.cinv){const {error}=await S.sb.from("zay_invites").delete().eq("token",d.cinv);toast(error?"تعذّر الإلغاء":"أُلغي الرابط");refresh()}
});

/* ============ التحديث بالسحب للأسفل + فحص النسخة ============ */
const APP_VERSION="2026-11-11.1";
function hardReload(){const u=new URL(location.href);u.searchParams.set("v",Date.now());location.replace(u.toString())}
async function newVersion(){try{const t=await (await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"})).text();const m=t.match(/APP_VERSION="([^"]+)"/);return m&&m[1]!==APP_VERSION?m[1]:null}catch(e){return null}}
$("#updBar").onclick=hardReload;
(function(){
  const ptr=$("#ptr"),txt=$("#ptrT");let y0=null,dy=0,busy=false;const TH=80;
  const can=()=>!busy&&$("#sheetBack").hidden&&(window.scrollY||document.documentElement.scrollTop)<=0;
  addEventListener("touchstart",e=>{if(can()&&e.touches.length===1){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
  addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy<=0){ptr.style.transform="translate(-50%,-70px)";return}
    const d=Math.min(dy*.5,90);ptr.style.transition="none";ptr.style.transform=`translate(-50%,${d-60}px)`;
    ptr.querySelector(".sp").style.transform=`rotate(${dy*2}deg)`;txt.textContent=dy>TH?"أفلت للتحديث":"اسحب للتحديث"},{passive:true});
  addEventListener("touchend",async()=>{if(y0==null)return;const pulled=dy>TH;y0=null;ptr.style.transition="";
    if(!pulled){ptr.style.transform="translate(-50%,-70px)";return}
    busy=true;ptr.classList.add("go");ptr.style.transform="translate(-50%,10px)";txt.textContent="جارٍ التحديث…";
    const nv=await newVersion();
    if(nv){txt.textContent="جارٍ تحميل النسخة الجديدة…";setTimeout(hardReload,300);return}
    await refresh();txt.textContent="تم التحديث";
    setTimeout(()=>{ptr.classList.remove("go");ptr.style.transform="translate(-50%,-70px)";busy=false},600)});
})();
async function autoCheck(){const nv=await newVersion();if(!nv)return;
  const a=document.activeElement;const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if($("#sheetBack").hidden&&!typing)hardReload();else $("#updBar").hidden=false}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")autoCheck()});
setInterval(()=>{if(document.visibilityState==="visible")autoCheck()},5*60000);

/* ============ التشغيل ============ */
(async function boot(){
  route();
  if(!window.supabase){$("#status").textContent="تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم حدّث الصفحة.";return}
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  S.sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")openAuth("newpass")});
  await afterAuth();
  if(inviteToken&&!S.user)openAuth("in");
  setInterval(()=>{if(document.visibilityState==="visible"&&$("#sheetBack").hidden)refresh()},45000);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
})();
</script>
