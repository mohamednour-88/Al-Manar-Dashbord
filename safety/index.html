<html lang="ar" dir="rtl">
<head>

<title>خرائط الإخلاء والسلامة — مدارس الأندلس</title>

<style>
:root{--n:#212178;--n2:#2e2e95;--b:#0099DD;--g:#BC9C42;--gr:#BBBDBE;--ink:#20233f;--mut:#676b82;--line:#e3e4ee;--bg:#f4f5fa;--card:#fff;--ok:#1E8E3E;--warn:#C47F00;--bad:#C62828;--sel:#0099DD;--r:14px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Mada,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* top bar */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.sb{background:var(--n);color:#e4e4f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh}
.sb .brand{padding:20px 18px 16px;border-bottom:2px solid var(--g);display:flex;align-items:center;gap:12px}
.sb .brand img{height:40px}
.sb .brand b{display:block;font-size:15.5px;color:#fff;font-weight:800}
.sb .brand span{display:block;font-size:12.5px;color:#c9c9e6;margin-top:2px}
.sb nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1}
.sb nav button{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:6px;border:0;border-inline-start:3px solid transparent;background:none;color:#d6d6ec;font-weight:600;text-align:start;white-space:nowrap}
.sb nav button:hover{background:rgba(255,255,255,.06)}
.sb nav button.on{background:rgba(255,255,255,.11);border-inline-start-color:var(--g);color:#fff;font-weight:800}
.sb nav button svg{width:19px;height:19px;flex:none}
.sb .mode{margin:8px 12px 10px;padding:9px 11px;border-radius:6px;font-size:12px;line-height:1.7}
.sb .mode.cloud{background:rgba(30,142,62,.2);color:#c4ecd2}.sb .mode.local{background:rgba(188,156,66,.25);color:#ffe9b0}
.sb .who{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;display:flex;align-items:center;gap:8px}
.sb .who b{display:block;color:#fff;font-size:13.5px}.sb .who small{color:#b9b9dc}
.sb .who .sp{flex:1}.sb .who button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 10px;font-size:12px}
.mnav{display:none}
.app:has(main.full){grid-template-columns:1fr}.app:has(main.full) .sb,.app:has(main.full) .mnav{display:none}
body.nolog .sb,body.nolog .mnav{display:none}body.nolog .app{grid-template-columns:1fr}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis>div{padding:13px 15px;border-inline-start:1px solid var(--line)}.kpis>div:first-child{border-inline-start:0}
.kpis b{display:block;font-size:25px;font-weight:800;color:var(--n);font-variant-numeric:tabular-nums}.kpis small{color:var(--mut);font-size:12.5px}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f6;font-size:13.5px;line-height:1.6}.feed li:last-child{border:0}.feed time{color:var(--mut);font-size:12px;white-space:nowrap;margin-inline-start:auto}
.help ol,.help ul{line-height:2.1;padding-inline-start:22px;margin:6px 0}.help h3{color:var(--n);margin:4px 0 6px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:30px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-draft{background:#eef0f7;color:#4a4f6b}.st-review{background:#fff3d6;color:#8a5a00}.st-approved{background:#e2f3e8;color:var(--ok)}.st-none{background:#f1f1f4;color:#9a9caf}
main{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
main.full{max-width:none;padding:0}
h1.pg{font-size:24px;margin:4px 0 4px;color:var(--n)}p.pgs{margin:0 0 18px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 15px;font-weight:600;min-height:42px}
.btn:hover{border-color:#c8cae0}
.btn.pri{background:var(--n);border-color:var(--n);color:#fff}.btn.pri:hover{background:var(--n2)}
.btn.gold{background:var(--g);border-color:var(--g);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input.in,select.in,textarea.in{border:1px solid #d6d8e6;border-radius:10px;padding:9px 12px;background:#fff;min-height:42px;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid #bfe6f8;border-color:var(--b)}
.muted{color:var(--mut)}.small{font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
/* tree */
.br{margin-bottom:18px}
.br-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.br-h h2{margin:0;font-size:19px;color:var(--n)}
.bld{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.bld-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fafbfe;border-bottom:1px solid var(--line)}
.bld-h b{font-size:16px}
.fl{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f1f6}
.fl:last-child{border-bottom:0}
.fl .nm{font-weight:700}
@media (max-width:760px){.fl{grid-template-columns:1fr auto}.fl .hide-s{display:none}}
/* steps */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 14px;border-radius:30px;background:#eef0f7;color:#585d7a;font-weight:600;font-size:13.5px;border:0}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:12px;font-weight:800}
.step.on{background:var(--n);color:#fff}.step.on i{color:var(--n)}
.step.done i{background:var(--ok);color:#fff}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto auto minmax(0,1fr);height:100vh;height:100dvh}
.ed-bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-bar .loc{font-weight:800;color:var(--n);font-size:16px}
.save{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save.busy i{background:var(--warn)}.save.off i{background:var(--bad)}
.tools{grid-column:1/2;display:flex;gap:6px;padding:8px 10px;background:#fbfbfe;border-bottom:1px solid var(--line);overflow-x:auto;align-items:stretch}
@media (min-width:701px){.tools{flex-wrap:wrap;overflow:visible}}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:78px;min-height:66px;border:1px solid transparent;background:none;border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.2;text-align:center;padding:5px 3px;color:var(--ink)}
.tool:hover{background:#fff;border-color:var(--line)}
.tool.on{background:#e6f5fc;border-color:var(--b);color:#00618d}
.tool svg{width:30px;height:30px}
.tool:disabled{opacity:.35}
.tsep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.canvas{grid-column:1/2;position:relative;overflow:hidden;background:#e9eaf2;touch-action:none;user-select:none;-webkit-user-select:none}
.canvas svg.board{position:absolute;inset:0;width:100%;height:100%;display:block}
.canvas.mode-place{cursor:crosshair}.canvas.mode-route{cursor:crosshair}.canvas.panning{cursor:grabbing}
.zoom{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.zoom button svg{width:20px;height:20px}
.hint{position:absolute;top:12px;right:50%;transform:translateX(50%);background:rgba(33,33,120,.94);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;z-index:4;max-width:min(560px,90%);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hint button{background:none;border:0;color:#bfe6f8;font-weight:700;margin-inline-start:8px}
.banner{position:absolute;top:12px;right:12px;left:12px;z-index:4;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.appr{background:#e2f3e8;color:#155e2c;border:1px solid #bfe3cb}
.banner.rev{background:#fff3d6;color:#7a4f00;border:1px solid #f1dda3}
.banner.ret{background:#fde8e8;color:#8c1d1d;border:1px solid #f5c2c2}
.side{grid-column:2/3;grid-row:2/4;background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 6px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;font-size:14px}
.tabs button.on{color:var(--n);border-color:var(--n)}
.side .lst{flex:1;overflow:auto;padding:8px}
.it{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.it:hover{background:#f6f7fc}
.it.sel{background:#e6f5fc;border-color:#9fd7f1}
.it .ic{width:30px;height:30px;flex:none}
.it .nm{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sub{font-size:12px;color:var(--mut);font-weight:500}
.it .x{border:0;background:none;color:#a2a4b6;padding:4px;border-radius:7px}
.it .x:hover{color:var(--bad);background:#fdeaea}
.grp{font-size:12.5px;font-weight:800;color:var(--mut);padding:10px 8px 4px}
.props{border-top:1px solid var(--line);padding:12px;background:#fbfbfe;display:grid;gap:10px}
.props h4{margin:0;font-size:14px;color:var(--n)}
.seg{display:flex;border:1px solid #d6d8e6;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:8px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--n);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.chk input{width:18px;height:18px}
.layers{position:absolute;top:12px;left:12px;z-index:3}
.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,20,60,.16);padding:10px 12px;z-index:20;min-width:210px}
/* dialogs */
.ov{position:fixed;inset:0;background:rgba(15,16,45,.45);display:grid;place-items:center;z-index:100;padding:16px}
.dlg{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.wide{max-width:1100px}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:18px;color:var(--n);flex:1}
.dlg-b{padding:18px 20px;overflow:auto;display:grid;gap:14px}
.dlg-f{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x-btn{border:0;background:#f1f2f7;width:36px;height:36px;border-radius:10px;font-size:20px}
.warn{background:#fff6e0;border:1px solid #f1dda3;color:#6d4a00;padding:10px 14px;border-radius:11px;font-size:14px}
.warn ul{margin:6px 0 0;padding-inline-start:18px}
.info{background:#eef7fc;border:1px solid #c7e6f6;color:#0c4a68;padding:10px 14px;border-radius:11px;font-size:14px}
.err{background:#fdeaea;border:1px solid #f5c2c2;color:#8c1d1d;padding:10px 14px;border-radius:11px;font-size:14px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:right;font-size:12.5px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid #f0f1f6;vertical-align:middle}
.tb tr:hover td{background:#fafbfe}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d1f3d;color:#fff;padding:11px 18px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%}
.prog{height:8px;background:#eceef6;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--b);width:0;transition:width .2s}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.thumbs button{border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:600}
.thumbs button.on{border-color:var(--b);background:#e6f5fc}
.thumbs img{width:100%;height:120px;object-fit:contain;background:#f6f6f9;border-radius:8px}
.drop{border:2px dashed #c3c6dc;border-radius:16px;padding:40px 20px;text-align:center;background:#fff;cursor:pointer}
.drop.over{border-color:var(--b);background:#eef8fd}
.drop svg{width:52px;height:52px;color:var(--n)}
.prev-wrap{background:#e9eaf2;border-radius:12px;padding:12px;display:grid;place-items:center}
.prev-wrap canvas{max-width:100%;max-height:68vh;box-shadow:0 4px 18px rgba(0,0,0,.18);background:#fff}
.login{max-width:420px;margin:8vh auto;padding:30px}
.login img{height:70px;display:block;margin:0 auto 14px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.symgrid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600}
.symgrid button svg{width:40px;height:40px}
@media (max-width:980px){.ed{grid-template-columns:minmax(0,1fr) 270px}}
@media (max-width:700px){.ed{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) 38%}.side{grid-column:1;grid-row:4}}
@media (max-width:860px){.app{grid-template-columns:1fr}.sb{display:none}.mnav{display:flex;gap:4px;overflow:auto;background:var(--n);padding:7px;position:sticky;top:0;z-index:30}.mnav button{background:none;border:0;color:#dfe0f5;padding:8px 11px;border-radius:7px;white-space:nowrap;font-size:13.5px;font-weight:600}.mnav button.on{background:#fff;color:var(--n)}}
</style>
</head>

function toast(m,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function dialog({title,body,foot,wide,onClose}){const ov=document.createElement("div");ov.className="ov";ov.innerHTML=`<div class="dlg ${wide?"wide":""}" role="dialog" aria-modal="true"><div class="dlg-h"><h3>${esc(title)}</h3><button class="x-btn" aria-label="إغلاق">×</button></div><div class="dlg-b"></div>${foot!==false?'<div class="dlg-f"></div>':""}</div>`;
 const b=ov.querySelector(".dlg-b");if(typeof body==="string")b.innerHTML=body;else if(body)b.appendChild(body);
 const close=()=>{ov.remove();document.removeEventListener("keydown",k);onClose&&onClose()};const k=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",k);
 ov.querySelector(".x-btn").onclick=close;ov.addEventListener("pointerdown",e=>{if(e.target===ov)ov.dataset.dn=1});ov.addEventListener("click",e=>{if(e.target===ov&&ov.dataset.dn)close();delete ov.dataset.dn});
 $("#layer").appendChild(ov);return{el:ov,body:b,foot:ov.querySelector(".dlg-f"),close}}
function confirmBox(title,msg,okText="تأكيد",danger){return new Promise(res=>{const d=dialog({title,body:`<div>${msg}</div>`,onClose:()=>res(false)});d.foot.innerHTML=`<button class="btn ${danger?"danger":"pri"}" data-ok>${esc(okText)}</button><button class="btn" data-no>إلغاء</button>`;d.foot.querySelector("[data-ok]").onclick=()=>{res(true);d.el.remove()};d.foot.querySelector("[data-no]").onclick=()=>{res(false);d.el.remove()}})}
function promptBox(title,label,val="",extra=""){return new Promise(res=>{const d=dialog({title,body:`<label class="f">${esc(label)}<input class="in" value="${esc(val)}"></label>${extra}`,onClose:()=>res(null)});const i=d.body.querySelector("input");setTimeout(()=>{i.focus();i.select()},30);
 const ok=()=>{const v=i.value.trim();if(!v){i.focus();return}res(v);d.el.remove()};i.onkeydown=e=>{if(e.key==="Enter")ok()};d.foot.innerHTML=`<button class="btn pri">حفظ</button><button class="btn">إلغاء</button>`;d.foot.children[0].onclick=ok;d.foot.children[1].onclick=()=>{res(null);d.el.remove()}})}

const IDB={db:null,async open(){if(this.db)return this.db;this.db=await new Promise((res,rej)=>{const r=indexedDB.open("andalus-safety-local",1);r.onupgradeneeded=()=>{r.result.createObjectStore("t");r.result.createObjectStore("f")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this.db},
 async get(s,k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 async put(s,k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(s,"readwrite");t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};

 async settings(){const r=await this.rows("sm_settings");return (r[0]&&r[0].data)||{}},async saveSettings(d){await this.save("sm_settings",[{id:"main",data:d}])},
 async transition(pid,action,note){const p=(await this.rows("sm_projects")).find(x=>x.id===pid);const who=this.me.email;let patch={};
  if(action==="submit"){if(p.status!=="draft")throw new Error("الخريطة ليست مسودة");patch={status:"review",return_note:null}}

  else if(action==="withdraw"){patch={status:"draft"}}

 async function handleFile(file){const area=$("#upArea");area.innerHTML=`<div class="card"><div class="row"><b>جاري قراءة الملف…</b></div><div class="prog" style="margin-top:10px"><i style="width:30%"></i></div></div>`;

    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const v=pg.getViewport({scale:1});const sc=Math.min(240/v.width,240/v.height);const c=document.createElement("canvas");const vv=pg.getViewport({scale:sc});c.width=vv.width;c.height=vv.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vv}).promise;pages.push({i,thumb:c.toDataURL("image/png"),w:v.width,h:v.height})}

  }catch(e){console.error(e);area.innerHTML=`<div class="err">تعذر قراءة الملف: ${esc(e.message)}</div>`}
  async function finish(canvas0,page){const canvas=await prepPlan(area,canvas0);if(!canvas)return;area.innerHTML=`<div class="card"><b>جاري حفظ المخطط…</b><div class="prog" style="margin-top:10px"><i style="width:70%"></i></div></div>`;

function prepPlan(area,src){return new Promise(res=>{let cv=src,crop=null;
 const draw=()=>{area.innerHTML=`<div class="card"><div class="row"><b>تجهيز المخطط قبل الحفظ</b><span class="sp"></span><span class="muted small">${cv.width} × ${cv.height}</span></div>
  <div class="muted small" style="margin:6px 0 10px">دوّر المخطط إن لزم، واسحب على الصورة لتحديد جزء المخطط فقط (اختياري) — يُقص عند الحفظ.</div>
  <div class="prev-wrap"><div id="ppW" style="position:relative;display:inline-block;direction:ltr;touch-action:none;user-select:none"><canvas id="ppC" style="display:block;max-width:100%;max-height:60vh;cursor:crosshair"></canvas><div id="ppB" style="position:absolute;border:2px solid #0099DD;background:rgba(0,153,221,.10);box-shadow:0 0 0 9999px rgba(10,25,40,.35);display:none;pointer-events:none"></div></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="ppR">↻ تدوير يمين</button><button class="btn" id="ppL">↺ تدوير يسار</button><button class="btn" id="ppX" ${crop?"":"disabled"}>إلغاء القص</button><span class="sp"></span><button class="btn pri" id="ppOK">حفظ المخطط</button></div></div>`;
  const pc=$("#ppC"),k=Math.min(1,1400/Math.max(cv.width,cv.height));pc.width=Math.round(cv.width*k);pc.height=Math.round(cv.height*k);pc.getContext("2d").drawImage(cv,0,0,pc.width,pc.height);
  const box=$("#ppB");const show=()=>{if(!crop){box.style.display="none";return}const s=pc.clientWidth/cv.width;Object.assign(box.style,{display:"block",left:crop[0]*s+"px",top:crop[1]*s+"px",width:crop[2]*s+"px",height:crop[3]*s+"px"})};requestAnimationFrame(show);
  let st=null;const pos=e=>{const r=pc.getBoundingClientRect();const s=cv.width/r.width;return[Math.max(0,Math.min(cv.width,(e.clientX-r.left)*s)),Math.max(0,Math.min(cv.height,(e.clientY-r.top)*s))]};
  pc.onpointerdown=e=>{pc.setPointerCapture(e.pointerId);st=pos(e)};pc.onpointermove=e=>{if(!st)return;const p=pos(e);crop=[Math.min(st[0],p[0]),Math.min(st[1],p[1]),Math.abs(p[0]-st[0]),Math.abs(p[1]-st[1])];show()};
  pc.onpointerup=()=>{st=null;if(crop&&(crop[2]<cv.width*.03||crop[3]<cv.height*.03))crop=null;show();$("#ppX").disabled=!crop};
  const rot=dir=>{const c=document.createElement("canvas");c.width=cv.height;c.height=cv.width;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(dir*Math.PI/2);x.drawImage(cv,-cv.width/2,-cv.height/2);cv=c;crop=null;draw()};
  $("#ppR").onclick=()=>rot(1);$("#ppL").onclick=()=>rot(-1);$("#ppX").onclick=()=>{crop=null;show();$("#ppX").disabled=true};
  $("#ppOK").onclick=()=>{if(!crop)return res(cv);const[cx,cy,w,h]=crop.map(Math.round);const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(cv,cx,cy,w,h,0,0,w,h);res(c)}};
 draw()})}
async function renderPdfPage(doc,n){const pg=await doc.getPage(n);const v=pg.getViewport({scale:1});const target=6000;let sc=target/Math.max(v.width,v.height);sc=Math.min(sc,Math.sqrt(36e6/(v.width*v.height)));const vv=pg.getViewport({scale:sc});const c=document.createElement("canvas");c.width=Math.round(vv.width);c.height=Math.round(vv.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vv,background:"#ffffff"}).promise;return c}
const blobImage=b=>new Promise((res,rej)=>{const u=URL.createObjectURL(b);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>rej(new Error("صورة غير صالحة"));i.src=u});

 await DB.update("sm_projects",p.id,{plan_id:plan.id,data});await DB.note(p.id,"plan","استبدال المخطط: "+file.name)}

class Editor{
 constructor(o){Object.assign(this,o);this.data=clone(this.project.data||{});for(const k of["markers","points","routes"])this.data[k]=this.data[k]||[];
  this.W=this.plan.width;this.H=this.plan.height;this.base=Math.max(this.W,this.H)*0.022;
  this.mode="select";this.sel=new Set();this.undo=[];this.redo=[];this.tab="items";this.hidden=new Set();this.view={k:1,x:0,y:0};this.saveState="ok";this.dirty=false;this.route=null;this.vsel=null;

   <div class="zoom"><button data-z="in" title="تكبير">+</button><button data-z="out" title="تصغير">−</button><button data-z="fit" title="ملاءمة الشاشة">${ICO.fit}</button></div>
   <div class="layers"><button class="btn sm" id="lyB">${ICO.eye}إظهار وإخفاء</button></div><div id="hint" class="hint hidden"></div><div id="banner" class="banner hidden"></div></div>
   <aside class="side"><div class="tabs" id="tabs"></div><div class="lst" id="lst"></div><div class="props" id="props"></div></aside></div>`;
  this.svg=$("#board");this.vp=$("#vp");this.cv=$("#cv");this.defs();

  if(this.pendingLocal)setTimeout(async()=>{if(await confirmBox("تعديلات غير محفوظة",`وُجدت تعديلات محفوظة على هذا الجهاز بتاريخ ${fmtDT(this.pendingLocal.at)} لم تصل للخادم (ربما بسبب انقطاع الاتصال). هل تريد استعادتها؟`,"استعادة التعديلات")){this.pushUndo();this.data=this.pendingLocal.data;this.renderAll();this.changed()}else{localStorage.removeItem(this.lsKey())}},200)}

 renderTools(){const ro=this.ro;const t=(id,label,icon,on,dis)=>`<button class="tool ${on?"on":""}" data-t="${id}" ${dis?"disabled":""} title="${esc(label)}">${icon}<span>${label}</span></button>`;

 const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n`);if(Array.isArray(body))body.forEach(push);else push(body);push("\nendobj\n")};
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);

  obj(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wpt.toFixed(2)} ${hpt.toFixed(2)}] /Resources << /XObject << /Im${i} ${id+2} 0 R >> >> /Contents ${id+1} 0 R >>`);
  const cs=`q ${wpt.toFixed(2)} 0 0 ${hpt.toFixed(2)} 0 0 cm /Im${i} Do Q`;obj(id+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  obj(id+2,[`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,"\nendstream"])}

   for(const pl of out.tables.sm_plans){for(const k of["image_path","original_path"]){if(!pl[k])continue;try{const b=await DB.getFile(pl[k]);out.files[pl[k]]={type:b.type,data:await blobB64(b)}}catch(e){}}st.textContent="جاري حفظ المخططات…"}
   download(new Blob([JSON.stringify(out)],{type:"application/json"}),`نسخة احتياطية - خرائط الإخلاء - ${new Date().toISOString().slice(0,10)}.json`);st.textContent="تم التصدير."}catch(e){st.textContent=e.message}};
  $("#bI").onchange=async()=>{const f=$("#bI").files[0];if(!f)return;const st=$("#bIs");try{const j=JSON.parse(await f.text());if(j.app!=="andalus-safety-maps")throw new Error("الملف ليس نسخة احتياطية لهذا التطبيق");
   if(!await confirmBox("استيراد",`سيتم استيراد ${Object.values(j.tables).reduce((a,b)=>a+b.length,0)} سجلًا و${Object.keys(j.files).length} ملفًا. متابعة؟`,"استيراد"))return;st.innerHTML=`<div class="info">جاري الاستيراد…</div>`;
   for(const[p,v]of Object.entries(j.files)){const b=await (await fetch(`data:${v.type};base64,${v.data}`)).blob();await DB.putFile(p,b)}
   await importTables(j.tables);st.innerHTML=`<div class="info">تم الاستيراد.</div>`;await loadAll()}catch(e){st.innerHTML=`<div class="err">${esc(e.message)}</div>`}}}
 if(tab==="log"){const log=(await DB.list("sm_log")).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,300);const pf=id=>{const p=S.projects.find(x=>x.id===id);if(!p)return"—";const i=flInfo(p.floor_id);return `${i.branch.name||""} ← ${i.building.name||""} ← ${i.floor.name||""}`};
  A.innerHTML=`<div class="card" style="overflow:auto">${log.length?`<table class="tb"><tr><th>التاريخ</th><th>الإجراء</th><th>الدور</th><th>بواسطة</th><th>ملاحظة</th></tr>${log.map(l=>`<tr><td class="small">${fmtDT(l.at)}</td><td>${esc(ACT[l.action]||l.action)}</td><td class="small">${esc(pf(l.project_id))}</td><td class="small">${esc(l.by_email||"")}</td><td class="small">${esc(l.note||"")}</td></tr>`).join("")}</table>`:`<div class="empty">لا توجد إجراءات بعد.</div>`}</div>`}}
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.readAsDataURL(b)});
async function importTables(T){const order=["sm_branches","sm_buildings","sm_floors","sm_plans","sm_projects","sm_versions","sm_settings","sm_members","sm_installs"];
 if(DB.kind==="local"){for(const t of order){if(!T[t])continue;const cur=await DB.rows(t);const key=t==="sm_members"?"email":"id";const map=new Map(cur.map(x=>[x[key],x]));for(const r of T[t])map.set(r[key],r);await DB.save(t,[...map.values()])}return}
 for(const t of order){if(!T[t]||!T[t].length)continue;if(t==="sm_versions"||t==="sm_log")continue;
  if(t==="sm_projects"){for(const r of T[t]){const ex=S.projects.find(p=>p.id===r.id);const row={id:r.id,floor_id:r.floor_id,branch_id:r.branch_id,plan_id:r.plan_id,data:r.data};if(!ex){await DB.insert(t,row)}else if(ex.status==="draft")await DB.update(t,r.id,{plan_id:r.plan_id,data:r.data})}continue}
  if(t==="sm_settings"){await DB.saveSettings(T[t][0].data);continue}
  const r=await RemoteDB.sb.from(t).upsert(T[t],{onConflict:t==="sm_members"?"email":t==="sm_installs"?"project_id,point_id":"id"});RemoteDB.chk(r)}}

/* ======================= الدخول والتشغيل ======================= */
function viewLogin(msg){document.body.classList.add("nolog");$("#nav").innerHTML="";$("#who").innerHTML="";const m=$("#main");m.className="";
 m.innerHTML=`<div class="card login"><img src="logo-n.png" alt="شعار مدارس الأندلس"><h1 class="pg" style="text-align:center">خرائط الإخلاء والسلامة</h1><p class="pgs" style="text-align:center">ادخل بحساب منصة المنار (البريد وكلمة المرور).</p>${msg?`<div class="err" style="margin-bottom:12px">${msg}</div>`:""}
 <form id="lf" class="grid"><label class="f">البريد الإلكتروني<input class="in" id="le" type="email" dir="ltr" autocomplete="username" required></label><label class="f">كلمة المرور<input class="in" id="lp" type="password" dir="ltr" autocomplete="current-password" required></label><button class="btn pri" style="width:100%">دخول</button></form>
 <div class="muted small" style="text-align:center;margin-top:14px">للتجربة دون حساب: <a href="?local=1">الوضع التجريبي المحلي</a></div></div>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;const {error}=await RemoteDB.sb.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});if(error){b.disabled=false;viewLogin("تعذر الدخول: تحقق من البريد وكلمة المرور.");return}boot()}}
async function boot(){
 if(LOCAL||!window.supabase){DB=LocalDB;S.me=LocalDB.me;if(!(await LocalDB.rows("sm_members")).length)await LocalDB.save("sm_members",[LocalDB.me]);S.members=await LocalDB.rows("sm_members");if(!LOCAL)toast("تعذر الاتصال بالخادم — يعمل التطبيق في الوضع المحلي",5000);renderNav();return go(S.view)}
 DB=RemoteDB;if(!RemoteDB.sb)RemoteDB.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 const {data:{session}}=await RemoteDB.sb.auth.getSession();if(!session)return viewLogin();
 try{const r=await RemoteDB.sb.rpc("sm_me");const me=r.data&&(Array.isArray(r.data)?r.data[0]:r.data);if(r.error)throw r.error;
  if(!me||!me.email){document.body.classList.add("nolog");$("#main").innerHTML=`<div class="card login"><img src="logo-n.png" alt=""><h1 class="pg" style="text-align:center">لا تملك صلاحية بعد</h1><p class="pgs" style="text-align:center">حسابك (${esc(session.user.email)}) غير مضاف إلى نظام خرائط الإخلاء. تواصل مع مدير النظام لإضافتك وتحديد فروعك.</p><button class="btn" id="lo2" style="width:100%">تسجيل الخروج</button></div>`;$("#lo2").onclick=async()=>{await RemoteDB.sb.auth.signOut();location.reload()};return}
  S.me=me;RemoteDB.me=me}catch(e){$("#main").innerHTML=`<div class="err" style="margin:20px">تعذر التحقق من الصلاحيات: ${esc(e.message||e)}<br>إذا كان هذا أول تشغيل، شغّل ملف الإعداد safety-setup.sql في Supabase.</div>`;return}
 try{S.members=S.admin?await DB.list("sm_members"):[S.me]}catch(e){S.members=[S.me]}
 renderNav();go(S.view)}
window.addEventListener("online",()=>{if(ED&&ED.dirty)ED.flush()});
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
